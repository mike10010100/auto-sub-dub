[tools]
python = "3.11"

[tasks.install]
description = "Install project dependencies"
run = "pip install -r requirements.txt"

[tasks.run]
description = "Run the Auto-Dub pipeline"
run = """
export LD_LIBRARY_PATH=$LD_LIBRARY_PATH:$(python -c 'import nvidia.cudnn as c; import os; print(os.path.join(c.__path__[0], "lib"))')
python main.py
"""

[tasks.web]
description = "Launch the Streamlit web interface"
run = """
export LD_LIBRARY_PATH=$LD_LIBRARY_PATH:$(python -c 'import nvidia.cudnn as c; import os; print(os.path.join(c.__path__[0], "lib"))')
streamlit run app.py
"""

[tasks.test]
description = "Run a test synthesis"
run = """
export LD_LIBRARY_PATH=$LD_LIBRARY_PATH:$(python -c 'import nvidia.cudnn as c; import os; print(os.path.join(c.__path__[0], "lib"))')
python src/synthesizer.py
"""

[env]
PYTHONPATH = "."
OLLAMA_URL = "http://192.168.86.172:11434"
OLLAMA_MODEL = "gemma4"
COQUI_TOS_AGREED = "1"
_.file = ".env"
