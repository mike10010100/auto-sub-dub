[tools]
python = "3.11"

[tasks."setup-fish"]
description = "Setup Fish Speech S2 Pro (clone s2.cpp, build it, and download GGUF models)"
run = """
if [ ! -d "s2.cpp" ]; then
    git clone --recurse-submodules https://github.com/rodrigomatta/s2.cpp.git
fi
cd s2.cpp
cmake -B build -DS2_CUDA=ON
cmake --build build --config Release
cd ..
python scripts/download_fish_models.py
"""

[tasks."setup-seed-vc"]
description = "Clone Seed-VC and install its dependencies, then fix conflicts"
run = """
if [ ! -d "seed-vc" ]; then
    git clone https://github.com/Plachtaa/seed-vc.git
fi
cd seed-vc
pip install -r requirements.txt
cd ..
# Re-assert our pipeline's specific versions that Seed-VC tries to break
pip install -r requirements.txt
pip install protobuf>=3.20
"""

[tasks.install]
description = "Install project dependencies"
run = "pip install -r requirements.txt && pip install pyphen"

[tasks.install-dev]
description = "Install project + dev (ruff, pytest, coverage) dependencies"
run = "pip install -r requirements-dev.txt"

[tasks.format]
description = "Auto-format code with ruff"
run = "ruff format ."

[tasks.lint]
description = "Lint with ruff (no fixes)"
run = "ruff check ."

[tasks."lint-fix"]
description = "Lint with ruff and auto-fix where safe"
run = "ruff check --fix ."

[tasks.unit]
description = "Run unit tests with coverage (fails under 90%)"
run = "pytest --cov --cov-report=term-missing --cov-fail-under=90"

[tasks."is-valid"]
description = "Format-check + lint + unit tests w/ 90% coverage gate. Run before declaring work done."
run = [
    "ruff format --check .",
    "ruff check .",
    "pytest --cov --cov-report=term-missing --cov-fail-under=90",
]

[tasks.integration]
description = "End-to-end pipeline test (requires models, Ollama, HF token, sample_video.mp4)"
run = """
export LD_LIBRARY_PATH=$LD_LIBRARY_PATH:$(python -c 'import nvidia.cudnn as c; import os; print(os.path.join(c.__path__[0], "lib"))')
pytest tests/integration -v -m integration
"""

[tasks.run]
description = "Run the Auto-Dub pipeline"
run = """
export LD_LIBRARY_PATH=$LD_LIBRARY_PATH:$(python -c 'import nvidia.cudnn as c; import os; print(os.path.join(c.__path__[0], "lib"))')
python main.py
"""

[tasks.web]
description = "Launch the Streamlit web interface"
run = """
export LD_LIBRARY_PATH=$LD_LIBRARY_PATH:$(python -c 'import nvidia.cudnn as c; import os; print(os.path.join(c.__path__[0], "lib"))')
streamlit run app.py
"""

[tasks.test]
description = "Run a test synthesis"
run = """
export LD_LIBRARY_PATH=$LD_LIBRARY_PATH:$(python -c 'import nvidia.cudnn as c; import os; print(os.path.join(c.__path__[0], "lib"))')
python src/synthesizer.py
"""

[env]
PYTHONPATH = "."
OLLAMA_URL = "http://192.168.86.172:11434"
OLLAMA_MODEL = "gemma4:26b"
OLLAMA_AUDIO_MODEL = "gemma4:e4b"
COQUI_TOS_AGREED = "1"
_.file = ".env"
